name: Core

# The pure-C# game core compiles and its tests run without Unity.
on:
  push:
    branches: [main]
    paths: ['unity/Assets/SecondFace/Core/**', 'unity/Assets/SecondFace/Tests/**', 'core/**', '.github/workflows/core.yml']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build core/SecondFace.Core.csproj --nologo
      - run: dotnet test core/SecondFace.Core.Tests/SecondFace.Core.Tests.csproj --nologo
