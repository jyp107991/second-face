# Deploys the game to GitHub Pages on every push to main: the current build at /second-face/, and, when a playtest
# branch exists (act1-test-N, frozen, never moved; the newest wins), that version at /second-face/act1/ with its own
# save namespace.
name: pages
on:
  push:
    branches: [main, 'act1-test-*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always build main for the root site, whatever ref triggered the run (a playtest push must not replace it).
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Build main
        run: |
          npm ci
          npm run check
          npm run build
          mkdir -p site && cp -r dist/* site/
      - name: Build the playtest version (newest act1-test-* branch)
        run: |
          REF=$(git branch -r --list 'origin/act1-test-*' --format='%(refname:short)' | sort -t- -k3,3nr | head -n 1)
          if [ -z "$REF" ]; then echo "no playtest branch"; exit 0; fi
          echo "playtest branch: $REF"
          git worktree add --detach playtest "$REF"
          cd playtest
          npm ci
          VITE_BASE=/second-face/act1/ VITE_SAVE_NS=act1 npm run build
          mkdir -p ../site/act1 && cp -r dist/* ../site/act1/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
